<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voter Management</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div id="app" style="display: block">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">
            <img src="../../assets/logos/SNHS Logo.jpg" alt="SNHS Logo" />
          </div>
          <h2>Election System</h2>
        </div>

        <div class="sidebar-menu">
          <div class="menu-title">Main Menu</div>
          <button class="menu-item" onclick="location.href = 'dashboard.html'">📊 Dashboard</button>
          <button class="menu-item active" onclick="location.href = 'voters.html'">
            👥 Voters
          </button>
          <button class="menu-item" onclick="location.href = 'candidates.html'">
            🧑 Candidates
          </button>
          <button class="menu-item" onclick="location.href = 'elections.html'">🗳️ Elections</button>
          <button class="menu-item" onclick="location.href = 'results.html'">📈 Results</button>
        </div>

        <button class="logout" onclick="adminLogout()">🚪 Logout</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 15px">
            <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
            <h1 class="page-title">Voter Management</h1>
          </div>

          <div class="top-right">
            <div class="system-status">
              <span class="dot"></span>
              <span id="topStatus">Online</span>
            </div>

            <div class="admin-profile">
              <div class="avatar">A</div>
              <span class="admin-name">Administrator</span>
            </div>
          </div>
        </header>

        <div class="content">
          <section class="page active" id="voters">
            <div class="card">
              <div class="card-header">
                <h3>Voter Management</h3>

                <div style="display: flex; gap: 8px">
                  <button class="btn" onclick="toggleArchive('voterArchive')">View Archive</button>

                  <button class="btn btn-primary" onclick="openModal('voterModal')">
                    + Add Voter
                  </button>
                </div>
              </div>

              <!-- SEARCH -->
              <div class="search-box">
                <input
                  type="text"
                  id="voterSearch"
                  placeholder="Search voter..."
                  onkeyup="searchVoters()"
                />
              </div>

              <!-- GRADE AND SECTION FILTERS -->
              <div
                style="
                  display: flex;
                  gap: 15px;
                  align-items: end;
                  margin-bottom: 20px;
                  flex-wrap: wrap;
                "
              >
                <div class="form-group">
                  <label for="voterGrade">Grade</label>

                  <select id="voterGrade">
                    <option value="">All Grades</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="voterSection">Section</label>

                  <select id="voterSection" disabled>
                    <option value="">All Sections</option>
                  </select>
                </div>
              </div>

              <!-- ACTIVE VOTERS TABLE -->
              <div class="table-container" id="voterActiveTableWrap">
                <table>
                  <thead>
                    <tr>
                      <th>Student ID</th>
                      <th>Name</th>
                      <th>Grade</th>
                      <th>Section</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>

                  <tbody id="voterTable"></tbody>
                </table>
              </div>
            </div>

            <!-- ARCHIVE -->
            <div class="card" id="voterArchive" style="display: none; margin-top: 20px">
              <div class="card-header">
                <h3>Voter Archive</h3>

                <button class="btn" onclick="toggleArchive('voterArchive')">Close Archive</button>
              </div>

              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Student ID</th>
                      <th>Name</th>
                      <th>Grade</th>
                      <th>Section</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>

                  <tbody id="voterArchiveTable"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- ADD VOTER MODAL -->
    <div class="modal" id="voterModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Add Voter</h3>

          <button type="button" class="close" onclick="closeModal('voterModal')">×</button>
        </div>

        <div class="modal-group">
          <label>Student ID</label>

          <input type="text" id="newStudentID" placeholder="e.g. 1234" />
        </div>

        <div class="modal-group">
          <label>Full Name</label>

          <input type="text" id="newVoterName" placeholder="Enter full name" />
        </div>

        <div class="modal-group">
          <label>Grade Level</label>

          <select id="newGrade">
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <div class="modal-group">
          <label>Section</label>

          <input type="text" id="newSection" placeholder="e.g. ICT-A" />
        </div>

        <div class="modal-group">
          <label>Voter Password</label>

          <div style="display: flex; gap: 8px">
            <input
              type="text"
              id="newVoterPassword"
              placeholder="Create voter password"
              autocomplete="new-password"
              style="flex: 1"
            />

            <button
              type="button"
              class="btn"
              onclick="togglePasswordVisibility('newVoterPassword', this)"
            >
              Hide
            </button>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal('voterModal')">Cancel</button>

          <button type="button" class="btn btn-primary" onclick="addVoter()">Add Voter</button>
        </div>
      </div>
    </div>

    <!-- EDIT VOTER MODAL -->
    <div class="modal" id="editVoterModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Edit Voter</h3>

          <button type="button" class="close" onclick="closeModal('editVoterModal')">×</button>
        </div>

        <div class="modal-group">
          <label>Student ID</label>

          <input type="text" id="editVoterID" readonly />
        </div>

        <div class="modal-group">
          <label>Full Name</label>

          <input type="text" id="editVoterName" />
        </div>

        <div class="modal-group">
          <label>Grade</label>

          <select id="editGrade">
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <div class="modal-group">
          <label>Section</label>

          <input type="text" id="editSection" />
        </div>

        <div class="modal-group">
          <label>New Password</label>

          <input
            type="password"
            id="editVoterPassword"
            placeholder="Leave blank to keep current password"
          />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal('editVoterModal')">Cancel</button>

          <button type="button" class="btn btn-primary" onclick="updateVoter()">
            Update Voter
          </button>
        </div>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>
  </body>
</html>
