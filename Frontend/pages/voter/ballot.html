<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Voting Ballot</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div id="voterApp" style="display: block">
      <header class="voter-topbar">
        <div class="voter-brand">
          <div class="voter-brand-icon">🗳️</div>
          <div>
            <strong>Student Voting Portal</strong>
            <div style="font-size: 12px; color: #78857d">Web-Based Election System</div>
          </div>
        </div>
        <div class="voter-user">
          <div id="voterMode" class="badge mode-online">● Online</div>
          <button class="btn btn-danger" onclick="voterLogout()">Logout</button>
        </div>
      </header>
      <div class="voter-content">
        <div id="offlineNotice" class="offline-notice" style="display: none">
          📡 You are offline. Your cached ballot can be submitted locally and synchronized when you
          reconnect.
        </div>
        <div id="ballotContainer">
          <div class="card"><p>Loading ballot...</p></div>
        </div>
      </div>
    </div>
    <script src="../../js/api.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/voter.js"></script>
    <script src="../../js/voting.js"></script>
  </body>
</html>
